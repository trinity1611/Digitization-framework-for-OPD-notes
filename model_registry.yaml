# Model registry. Add a model by adding an entry here; no application code
# changes are needed when an existing adapter class fits the architecture.
#
# Every repository, revision, size, parameter count and licence below was read
# from the Hugging Face Hub on 2026-11-13 (see docs/MODEL_DOWNLOAD_GUIDE.md).
# `revision` pins the exact commit that is downloaded and loaded. The
# application never substitutes another checkpoint for a registered one.
#
# Fields:
#   display_name, tier (primary | optional), repo_id, repo_url, docs_url, revision
#   architecture         model class named in the checkpoint's config.json
#   model_type           config.json model_type
#   adapter              "python.module:ClassName" implementing BaseVLMAdapter
#   processor_class      processor named by the checkpoint
#   backend              inference backend (only "transformers" is implemented)
#   image_input          must be true for this benchmark
#   parameters_total     all stored parameters (for MoE models this is NOT the active count)
#   parameters_active    parameters active per token for MoE models, else null
#   download_size_gb     size of the pinned revision's files
#   precision_options    floating-point precisions the backend can load
#   quantisation_options on-the-fly quantisation the backend can apply
#   licence, licence_url, gated, access_requirements
#   min_transformers     lowest Transformers version with this architecture
#   supports_thinking    model has a switchable reasoning mode
#   thinking_checkpoint_default  what the chat template does when nothing is passed
#   forbidden_repo_ids   look-alike checkpoints that must never be loaded for this entry

models:
  medgemma_27b:
    display_name: MedGemma 27B Multimodal IT
    tier: primary
    repo_id: google/medgemma-27b-it
    repo_url: https://huggingface.co/google/medgemma-27b-it
    docs_url: https://developers.google.com/health-ai-developer-foundations/medgemma/model-card-v1
    revision: 2d3e00ea38b50018bf5dd3aa1009457cd2d5a48f
    architecture: Gemma3ForConditionalGeneration
    model_type: gemma3
    adapter: rxbench.models.medgemma_27b:MedGemma27BAdapter
    processor_class: Gemma3Processor
    backend: transformers
    image_input: true
    parameters_total: 27432406640
    parameters_active: null
    download_size_gb: 54.90
    precision_options: [bf16, fp16, fp32]
    quantisation_options: [int8, int4]
    default_precision: bf16
    licence: Health AI Developer Foundations Terms of Use
    licence_url: https://developers.google.com/health-ai-developer-foundations/terms
    gated: true
    access_requirements: >-
      Gated (automatic approval). Sign in to Hugging Face, open the model page and
      accept the Health AI Developer Foundations terms; then authenticate with a
      token that can read gated repositories.
    min_transformers: "4.50.0"
    supports_thinking: false
    thinking_checkpoint_default: null
    forbidden_repo_ids: [google/medgemma-27b-text-it]
    notes: >-
      MedGemma 1 (Gemma 3 architecture), multimodal 27B. The text-only variant is
      google/medgemma-27b-text-it and must not be used. Native image input is a
      single 896x896 view encoded to 256 tokens (SigLIP); optional pan-and-scan tiling.
      The chat template has no reasoning switch, but Gemma-3-based MedGemma models can
      open a reasoning block (<unused94>thought ... <unused95>) on their own; it is
      kept in the raw output and reported in the metadata.

