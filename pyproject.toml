[project]
name = "rxbench"
version = "0.1.0"
description = "Zero-shot VLM benchmark for handwritten medical prescription transcription and extraction"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
